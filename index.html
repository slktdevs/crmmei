            <span style="font-size:11px; font-weight:800; letter-spacing:0.6px; background:rgba(255,255,255,0.2); padding:4px 10px; border-radius:999px;">SITE DISPONÍVEL EM LOCALHOST</span>
            <i data-lucide="globe" style="width:18px; height:18px;"></i>
          </div>
          <div style="font-size:19px; font-weight:800;">http://localhost:8080/site.html</div>
          <div style="font-size:13px; opacity:0.9; font-weight:600;">Seus clientes podem pedir orçamento online e os pedidos caem direto no seu painel em tempo real.</div>
          <div style="display:flex; gap:8px;">
            <button onclick="copiarLinkMiniSite()" style="flex:1; border:none; background:#fff; color:#0F172A; padding:10px; border-radius:12px; font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
              <i data-lucide="copy" style="width:15px; height:15px;"></i>
              <span>Copiar Link</span>
            </button>
            <a href="http://localhost:8080/site.html" target="_blank" style="flex:1; text-decoration:none; background:var(--verde); color:#fff; padding:10px; border-radius:12px; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;">
              <i data-lucide="external-link" style="width:15px; height:15px;"></i>
              <span>Abrir no Navegador</span>
            </a>
          </div>
        </div>

        <div class="crm-tabs">
          <button class="crm-tab-btn" style="background:${aba==='configurar'?'var(--azul)':'#fff'}; color:${aba==='configurar'?'#fff':'var(--ink-primary)'};" onclick="state.forms.abaMiniSite='configurar'; renderizarTelaPrincipal();">
            <i data-lucide="sliders" style="width:16px; height:16px;"></i>
            <div>Dados</div>
          </button>
          <button class="crm-tab-btn" style="background:${aba==='portfolio'?'var(--azul)':'#fff'}; color:${aba==='portfolio'?'#fff':'var(--ink-primary)'};" onclick="state.forms.abaMiniSite='portfolio'; renderizarTelaPrincipal();">
            <i data-lucide="image" style="width:16px; height:16px;"></i>
            <div>Portfólio (${state.portfolioObras.length})</div>
          </button>
          <button class="crm-tab-btn" style="background:${aba==='catalogo'?'var(--azul)':'#fff'}; color:${aba==='catalogo'?'#fff':'var(--ink-primary)'};" onclick="state.forms.abaMiniSite='catalogo'; renderizarTelaPrincipal();">
            <i data-lucide="list-checks" style="width:16px; height:16px;"></i>
            <div>Preços</div>
          </button>
        </div>

    }

    function abrirMiniSitePublico() {
      window.open("http://localhost:8080/site.html", "_blank");
    }

    function fecharMiniSitePublico() {
      document.getElementById("publicSiteModal").classList.remove("open");
    }

    function abrirWizard(tipo) {
      state.wizard = {
        aberto: true,
        tipo: tipo,
        passo: 1,
        servicoExistenteId: null,
        clienteSelecionadoId: state.clientes[0] ? state.clientes[0].id : null,
        catalogoSelecionadoId: state.catalogoServicos[0].id,
        descricao: "",
        valorString: "300",
        qtdParcelas: 1,
        metodoPagamento: "Pix",
        temFotoAnexa: false,
        mostrarFormNovoCliente: false
      };
      document.getElementById("wizardTitle").textContent = tipo === "orcamento" ? "Fazer Orçamento" : "Fazer Recibo";
      document.getElementById("wizardModal").classList.add("open");
      renderizarWizard();
    }

    function abrirWizardParaCliente(clienteId) {
      abrirWizard("orcamento");
      state.wizard.clienteSelecionadoId = clienteId;
      state.wizard.passo = 2;
      renderizarWizard();
    }

    function transformarEmReciboPDF(servicoId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;

      state.wizard = {
        aberto: true,
        tipo: "recibo",
        passo: 3,
        servicoExistenteId: servico.id,
        clienteSelecionadoId: servico.clienteId,
        catalogoSelecionadoId: state.catalogoServicos[0].id,
        descricao: servico.observacao || servico.tituloServico,
        valorString: String(servico.valor),
        qtdParcelas: (servico.parcelas || []).length || 1,
        metodoPagamento: servico.metodoPagamento || "Pix",
        temFotoAnexa: servico.temFotoAnexa
      };
      document.getElementById("wizardTitle").textContent = "Recibo Pronto";
      document.getElementById("wizardModal").classList.add("open");
      renderizarWizard();
    }

    function fecharWizard() {
      document.getElementById("wizardModal").classList.remove("open");
    }

    function irParaPasso(numero) {
      state.wizard.passo = numero;
      renderizarWizard();
    }

    function tocarTeclaCalculadora(tecla) {
      let atual = state.wizard.valorString;
      if (tecla === "⌫") {
        state.wizard.valorString = atual.slice(0, -1);
      } else {
        if (atual === "0" || atual === "") {
          state.wizard.valorString = tecla === "00" ? "0" : tecla;
        } else if (atual.length < 6) {
          state.wizard.valorString += tecla;
        }
      }
      renderizarWizard();
    }


    function alternarFormRapidoClienteWizard() {
      if (!state.wizard) return;
      state.wizard.mostrarFormNovoCliente = !state.wizard.mostrarFormNovoCliente;
      renderizarWizard();
    }

    function salvarClienteRapidoNoWizard() {
      const nomeInput = document.getElementById("wizNovoCliNome");
      const telInput = document.getElementById("wizNovoCliTel");
      const bairroInput = document.getElementById("wizNovoCliBairro");

      const nome = (nomeInput ? nomeInput.value : "").trim();
      const telefone = (telInput ? telInput.value : "").trim() || "(11) 99999-9999";
      const bairro = (bairroInput ? bairroInput.value : "").trim() || "Local da Obra";

      if (!nome) {
        mostrarToast("Digite pelo menos o nome do cliente");
        if (nomeInput) nomeInput.focus();
        return;
      }

      const novoCliente = {
        id: "cli_" + Date.now(),
        nome: nome,
        apelidoOuBairro: bairro,
        telefone: telefone,
        iniciais: obterIniciais(nome)
      };

      // Adiciona o cliente na lista global imediatamente
      state.clientes.unshift(novoCliente);
      // Seleciona o cliente recém criado no wizard
      state.wizard.clienteSelecionadoId = novoCliente.id;
      state.wizard.mostrarFormNovoCliente = false;
      persistirEstado();
      mostrarToast(`Cliente ${nome} adicionado!`);
      // Avança direto para o passo 2 para o profissional não perder tempo!
      irParaPasso(2);
    }

    function renderizarWizard() {
      const passo = state.wizard.passo;

      [1, 2, 3].forEach(n => {
        const pill = document.getElementById("stepPill" + n);
        pill.className = "step-pill";
        if (n === passo) pill.classList.add("active");
        else if (n < passo) pill.classList.add("done");
      });

      const body = document.getElementById("wizardBody");
      const footer = document.getElementById("wizardFooter");

      if (passo === 1) {
        const mostrarNovo = state.wizard.mostrarFormNovoCliente;

        const formRapidoHTML = mostrarNovo ? `
          <div class="accessible-card" style="border: 2px solid var(--azul); background: #F8FAFC; display:flex; flex-direction:column; gap:12px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(37,99,235,0.12);">
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <div style="display:flex; align-items:center; gap:8px;">
                <div style="width:34px; height:34px; border-radius:10px; background:var(--azul); color:#fff; display:flex; align-items:center; justify-content:center;">
                  <i data-lucide="user-plus" style="width:18px; height:18px;"></i>
                </div>
                <span style="font-size:16px; font-weight:900; color:var(--ink-primary);">Adicionar Cliente na Hora</span>
              </div>
              <button onclick="alternarFormRapidoClienteWizard()" style="border:none; background:#E2E8F0; width:30px; height:30px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
                <i data-lucide="x" style="width:16px; height:16px;"></i>
              </button>
            </div>

            <div>
              <label class="form-label" style="font-size:13px; font-weight:800;">Nome Completo ou Apelido *</label>
              <input id="wizNovoCliNome" class="clean-text-input" placeholder="Ex: Dona Maria do Sobrado" style="font-size:16px; font-weight:800;" autofocus />
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div>
                <label class="form-label" style="font-size:12px; font-weight:700;">WhatsApp / Celular</label>
                <input id="wizNovoCliTel" class="clean-text-input" placeholder="(11) 98888-7777" style="font-size:14px; font-weight:700;" />
              </div>
              <div>
                <label class="form-label" style="font-size:12px; font-weight:700;">Bairro / Cidade</label>
                <input id="wizNovoCliBairro" class="clean-text-input" placeholder="Ex: Centro / Rua 5" style="font-size:14px; font-weight:700;" />
              </div>
            </div>

            <button class="btn-physical btn-verde" onclick="salvarClienteRapidoNoWizard()" style="padding:13px; font-size:16px; margin-top:2px;">
              <i data-lucide="check" style="width:18px; height:18px;"></i>
              <span>Salvar Cliente e Avançar</span>
            </button>
          </div>
        ` : `
          <!-- Botão Gigante e Acessível para Criar Cliente na Hora -->
          <button class="btn-physical btn-azul" onclick="alternarFormRapidoClienteWizard()" style="padding:14px 16px; margin-bottom:12px; font-size:16px; justify-content:space-between; box-shadow: 0 4px 12px rgba(37,99,235,0.2);">
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;">
                <i data-lucide="user-plus" style="width:20px; height:20px;"></i>
              </div>
              <span style="font-weight:900;">+ Novo Cliente na Hora</span>
            </div>
            <i data-lucide="chevron-right" style="width:18px; height:18px;"></i>
          </button>
        `;

        const listaClientesHTML = state.clientes.map(c => {
          const sel = c.id === state.wizard.clienteSelecionadoId;
          return `
            <div class="accessible-card" onclick="state.wizard.clienteSelecionadoId='${c.id}'; renderizarWizard();"
                 style="cursor:pointer; display:flex; align-items:center; gap:14px; border-color:${sel ? 'var(--azul)' : 'var(--border-subtle)'}; background:${sel ? 'var(--azul-fundo)' : '#FFF'}; transition:all 0.15s ease;">
              <div class="avatar-initials" style="background:${sel ? 'var(--azul)' : 'var(--azul-fundo)'}; color:${sel ? '#fff' : 'var(--azul)'}; border-color:${sel ? 'var(--azul)' : 'transparent'};">
                ${c.iniciais}
              </div>
              <div style="flex:1; overflow:hidden;">
                <div style="font-size:17px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.nome}</div>
                <div style="font-size:13px; font-weight:700; color:var(--ink-secondary); margin-top:2px;">${c.apelidoOuBairro} • <span style="color:var(--azul);">${c.telefone}</span></div>
              </div>
              <i data-lucide="${sel ? 'check-circle-2' : 'circle'}" style="width:24px; height:24px; color:${sel ? 'var(--azul)' : '#CBD5E1'}; flex-shrink:0;"></i>
            </div>
          `;
        }).join("");

        body.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
            <div style="font-size:19px; font-weight:900;">1. Quem é o cliente?</div>
            <span style="font-size:12px; font-weight:700; color:var(--ink-secondary);">Toque ou crie novo</span>
          </div>

          ${formRapidoHTML}

          <div style="font-size:12px; font-weight:800; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; margin-bottom:4px;">
            Ou selecione da lista:
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${listaClientesHTML}
          </div>
        `;

        footer.innerHTML = `
          <button class="btn-physical btn-verde" onclick="irParaPasso(2)" style="font-size:17px; padding:15px;">
            <span style="flex:1; text-align:center; font-weight:900;">Continuar para o Serviço</span>
            <i data-lucide="arrow-right" style="width:20px; height:20px;"></i>
          </button>
        `;
      
      } else if (passo === 2) {
        const catalogoHTML = state.catalogoServicos.map(cat => {
          const sel = cat.id === state.wizard.catalogoSelecionadoId;
          return `
            <button class="catalog-item-btn ${sel ? 'selected' : ''}" onclick="state.wizard.catalogoSelecionadoId='${cat.id}'; state.wizard.valorString='${cat.valorSugerido}'; renderizarWizard();">
              <i data-lucide="${cat.icone || 'wrench'}" style="width:18px; height:18px;"></i>
              <span>${cat.nomeCurto}</span>
            </button>
          `;
        }).join("");

        body.innerHTML = `
          <div style="font-size:20px; font-weight:800;">2. O que vai ser feito?</div>

          <div class="catalog-grid">${catalogoHTML}</div>

          <div class="accessible-card">
            <div style="font-size:14px; font-weight:800;">Descrição ou Observação</div>
            <input class="clean-text-input" style="margin-top:8px;" value="${state.wizard.descricao}" placeholder="Ex: Pintura completa da sala..." oninput="state.wizard.descricao=this.value" />
          </div>

          <div class="accessible-card">
            <div style="font-size:15px; font-weight:800;">Valor do Serviço</div>
            <div class="pos-display">
              <span class="pos-currency">R$</span>
              <span class="pos-digits">${state.wizard.valorString || '0'}</span>
            </div>

            <div class="keypad-grid">
              ${["1","2","3","4","5","6","7","8","9","00","0","⌫"].map(k => `
                <button class="key-btn ${k === '⌫' ? 'backspace' : ''}" onclick="tocarTeclaCalculadora('${k}')">
                  ${k === '⌫' ? '<i data-lucide="delete" style="width:20px; height:20px;"></i>' : k}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="accessible-card" style="display:flex; flex-direction:column; gap:10px;">
            <div style="font-size:15px; font-weight:800;">Parcelamento e Forma de Pagamento</div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
              ${[1, 2, 3].map(qtd => {
                const ativo = (state.wizard.qtdParcelas || 1) === qtd;
                const valTotal = parseInt(state.wizard.valorString || "0", 10);
                const valCada = Math.round(valTotal / qtd);
                return `
                  <button onclick="state.wizard.qtdParcelas=${qtd}; renderizarWizard();"
                          style="cursor:pointer; padding:9px 5px; border-radius:12px; border:2px solid ${ativo ? 'var(--azul-escuro)' : 'var(--border-subtle)'}; background:${ativo ? 'var(--azul)' : 'var(--bg-app)'}; color:${ativo ? '#fff' : 'var(--ink-primary)'}; font-weight:800;">
                    <div style="font-size:14px;">${qtd === 1 ? 'À Vista' : qtd + ' Vezes'}</div>
                    <div style="font-size:11px; opacity:0.9;">${qtd}x ${formatarMoeda(valCada)}</div>
                  </button>
                `;
              }).join("")}
            </div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
              ${["Pix", "Dinheiro", "Cartão"].map(m => {
                const ativo = state.wizard.metodoPagamento === m;
                return `
                  <button onclick="state.wizard.metodoPagamento='${m}'; renderizarWizard();"
                          style="cursor:pointer; padding:9px; border-radius:12px; border:2px solid ${ativo ? '#0F172A' : 'var(--border-subtle)'}; background:${ativo ? '#0F172A' : '#fff'}; color:${ativo ? '#fff' : 'var(--ink-primary)'}; font-weight:800; font-size:13px;">
                    ${m}
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        `;

        footer.innerHTML = `
          <button class="btn-physical btn-branco" style="flex:1;" onclick="irParaPasso(1)">Voltar</button>
          <button class="btn-physical btn-verde" style="flex:2;" onclick="irParaPasso(3)">
            <span>Continuar</span>
            <i data-lucide="arrow-right" style="width:18px; height:18px;"></i>
          </button>
        `;
      } else {
        const cli = obterCliente(state.wizard.clienteSelecionadoId);
        const cat = state.catalogoServicos.find(c => c.id === state.wizard.catalogoSelecionadoId) || state.catalogoServicos[0];
        const valorNum = parseInt(state.wizard.valorString || "0", 10);
        const ehOrcamento = state.wizard.tipo === "orcamento";
        const corHeader = ehOrcamento ? "var(--amarelo)" : "var(--verde)";
        const tituloPDF = ehOrcamento ? "ORÇAMENTO DE SERVIÇO" : "RECIBO DE PAGAMENTO";

        body.innerHTML = `
          <div style="font-size:20px; font-weight:800;">3. Tudo Pronto</div>

          <div id="pdfPreviewElement" class="pdf-card">
            <div class="pdf-header" style="background: ${corHeader};">
              <div class="pdf-logo"><i data-lucide="wrench" style="width:24px; height:24px;"></i></div>
              <div>
                <div style="font-size:11px; font-weight:800; letter-spacing:0.6px; opacity:0.95;">${tituloPDF}</div>
                <div style="font-size:19px; font-weight:800;">${state.empresa.nomeExibicao}</div>
                <div style="font-size:12px; font-weight:700; opacity:0.92;">${state.empresa.telefoneWhatsApp} • localhost:8080/site.html</div>
              </div>
            </div>

            <div class="pdf-body">
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="avatar-initials">${cli.iniciais}</div>
                <div style="flex:1;">
                  <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">CLIENTE</div>
                  <div style="font-size:18px; font-weight:800;">${cli.nome}</div>
                  <div style="font-size:13px; font-weight:700; color:var(--ink-secondary);">${cli.apelidoOuBairro}</div>
                </div>
              </div>

              <hr style="border:none; border-top:1.5px solid var(--border-subtle);" />

              <div>
                <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">SERVIÇO COMBINADO</div>
                <div style="display:flex; align-items:center; gap:8px; font-size:17px; font-weight:800; margin-top:4px;">
                  <i data-lucide="${cat.icone || 'wrench'}" style="width:18px; height:18px; color:var(--azul);"></i>
                  <span>${cat.nomeCurto} (${state.wizard.metodoPagamento})</span>
                </div>
                ${state.wizard.descricao ? `<div style="margin-top:8px; background:var(--bg-app); padding:10px 12px; border-radius:12px; font-size:14px; font-weight:700; color:var(--ink-secondary);">${state.wizard.descricao}</div>` : ''}
              </div>

              <div class="pdf-total-box">
                <div>
                  <div style="font-size:12px; font-weight:800; color:var(--ink-secondary);">${ehOrcamento ? 'VALOR TOTAL' : 'VALOR RECEBIDO'}</div>
                  <div style="font-size:12px; font-weight:800; color:var(--verde-escuro);">${state.wizard.qtdParcelas > 1 ? `Parcelado em ${state.wizard.qtdParcelas}x` : (ehOrcamento ? 'Validade: 15 dias' : 'Pagamento Confirmado')}</div>
                </div>
                <div style="font-size:26px; font-weight:800; color:var(--verde-escuro);">${formatarMoeda(valorNum)}</div>
              </div>
            </div>
          </div>

          <button class="btn-physical btn-verde" style="padding: 15px;" onclick="confirmarEnvioWhatsApp()">
            <i data-lucide="send" style="width:20px; height:20px;"></i>
            <div style="flex:1;">
              <div style="font-size: 17px; font-weight: 800;">Mandar no WhatsApp Agora</div>
              <div style="font-size: 12px; font-weight: 700; opacity: 0.92;">Envia o PDF pronto para ${cli.nome}</div>
            </div>
          </button>

          <button class="btn-physical btn-branco" onclick="baixarPDFReal('${cli.nome}')">
            <i data-lucide="download" style="width:18px; height:18px;"></i>
            <span>Baixar Arquivo PDF no Aparelho</span>
          </button>
        `;

        footer.innerHTML = `
          <button class="btn-physical btn-branco" style="width:100%;" onclick="irParaPasso(2)">Voltar e Editar Valor</button>
        `;
      }

      atualizarIcones();
    }

    function baixarPDFReal(nomeCliente) {
      const elemento = document.getElementById("pdfPreviewElement");
      if (!elemento || typeof html2pdf === "undefined") {
        mostrarToast("PDF gerado com sucesso");
        return;
      }
      html2pdf()
        .set({
          margin: 10,
          filename: `Documento_${nomeCliente.replace(/\s+/g, "_")}.pdf`,
          html2canvas: { scale: 2 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        })
        .from(elemento)
        .save();
      mostrarToast("Arquivo PDF baixado");
    }

    function confirmarEnvioWhatsApp() {
      const valorNum = parseInt(state.wizard.valorString || "0", 10);
      const qtdParc = state.wizard.qtdParcelas || 1;
      const valorCada = Math.round(valorNum / qtdParc);
      const cat = state.catalogoServicos.find(c => c.id === state.wizard.catalogoSelecionadoId) || state.catalogoServicos[0];

      if (state.wizard.servicoExistenteId) {
        const existente = state.servicos.find(s => s.id === state.wizard.servicoExistenteId);
        if (existente) {
          existente.status = "pago";
          if (!existente.logs) existente.logs = [];
          existente.logs.unshift({ id: "log_" + Date.now(), dataHora: "Hoje", texto: "Recibo emitido e enviado no WhatsApp", tipo: "avanco" });
          (existente.parcelas || []).forEach(p => {
            p.pago = true;
            p.atrasada = false;
            p.vencimentoTexto = "Pago";
          });
        }
      } else {
        const novasParcelas = Array.from({ length: qtdParc }, (_, i) => {
          const num = i + 1;
          const jaPaga = state.wizard.tipo === "recibo" || (qtdParc > 1 && num === 1);
          return {
            id: "parc_" + Date.now() + "_" + num,
            numero: num,
            totalParcelas: qtdParc,
            valor: valorCada,
            vencimentoTexto: jaPaga ? "Pago" : (num === 1 ? "Vence HOJE" : `${num}ª Parcela (Falta)`),
            pago: jaPaga,
            atrasada: false
          };
        });

        state.servicos.unshift({
          id: "srv_" + Date.now(),
          clienteId: state.wizard.clienteSelecionadoId,
          tituloServico: cat.nomeCurto,
          categoria: cat.nomeCurto,
          icone: cat.icone,
          valor: valorNum,
          diaAgenda: "HOJE",
          horaAgenda: "15:00",
          metodoPagamento: state.wizard.metodoPagamento,
          status: state.wizard.tipo === "recibo" ? "pago" : "prontoCobrar",
          temFotoAnexa: state.wizard.temFotoAnexa,
          observacao: state.wizard.descricao,
          logs: [
            { id: "log_" + Date.now(), dataHora: "Hoje", texto: `${state.wizard.tipo === 'recibo' ? 'Recibo' : 'Orçamento'} criado e enviado no WhatsApp`, tipo: "nota" }
          ],
          parcelas: novasParcelas
        });
      }

      fecharWizard();
      persistirEstado();
      renderizarTelaPrincipal();
      mostrarToast("PDF enviado para o WhatsApp!");
    }

    persistirEstado();
    renderizarTelaPrincipal();
  </script>
</body>
</html>
