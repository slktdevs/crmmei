<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Parceiro Autônomo — CRM, Financeiro, Agenda & Mini Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-app: #F8FAFC;
      --card-surface: #FFFFFF;
      --ink-primary: #0F172A;
      --ink-secondary: #475569;
      --ink-muted: #64748B;
      --border-subtle: #E2E8F0;
      --verde: #10B981;
      --verde-escuro: #047857;
      --verde-fundo: #ECFDF5;
      --verde-borda: #A7F3D0;
      --amarelo: #F59E0B;
      --amarelo-escuro: #B45309;
      --amarelo-fundo: #FFFBEB;
      --amarelo-borda: #FDE68A;
      --vermelho: #EF4444;
      --vermelho-escuro: #B91C1C;
      --vermelho-fundo: #FEF2F2;
      --vermelho-borda: #FECACA;
      --azul: #2563EB;
      --azul-escuro: #1D4ED8;
      --azul-fundo: #EFF6FF;
      --azul-borda: #BFDBFE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #E2E8F0 0%, #CBD5E1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 10px;
      color: var(--ink-primary);
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      background: #0F172A;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
      max-width: 650px;
      width: 100%;
    }

    .preview-badge {
      background: var(--verde);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .toolbar-link {
      color: #93C5FD;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      background: rgba(255,255,255,0.1);
      padding: 5px 12px;
      border-radius: 999px;
      transition: background 0.15s ease;
    }
    .toolbar-link:hover {
      background: rgba(255,255,255,0.2);
    }

    .iphone-frame {
      width: 440px;
      max-width: 100%;
      height: 900px;
      background: var(--bg-app);
      border-radius: 52px;
      border: 12px solid #0F172A;
      box-shadow:
        0 28px 60px rgba(15, 23, 42, 0.32),
        0 0 0 2px #475569;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ios-status-bar {
      height: 46px;
      background: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    .dynamic-island {
      width: 110px;
      height: 27px;
      background: #0F172A;
      border-radius: 999px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .screen-content::-webkit-scrollbar { width: 0px; }

    .accessible-card {
      background: var(--card-surface);
      border-radius: 20px;
      border: 2px solid var(--border-subtle);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      padding: 16px;
    }

    .btn-physical {
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 15px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      user-select: none;
      text-align: left;
      width: 100%;
    }

    .btn-physical:active { transform: translateY(3px); }

    .btn-verde { background: var(--verde); box-shadow: 0 4px 0 var(--verde-escuro); }
    .btn-verde:active { box-shadow: 0 1px 0 var(--verde-escuro); }

    .btn-amarelo { background: var(--amarelo); box-shadow: 0 4px 0 var(--amarelo-escuro); }
    .btn-amarelo:active { box-shadow: 0 1px 0 var(--amarelo-escuro); }

    .btn-azul { background: var(--azul); box-shadow: 0 4px 0 var(--azul-escuro); }
    .btn-azul:active { box-shadow: 0 1px 0 var(--azul-escuro); }

    .btn-vermelho { background: var(--vermelho); box-shadow: 0 4px 0 var(--vermelho-escuro); }
    .btn-vermelho:active { box-shadow: 0 1px 0 var(--vermelho-escuro); }

    .btn-escuro { background: var(--ink-primary); box-shadow: 0 4px 0 #000; }
    .btn-escuro:active { box-shadow: 0 1px 0 #000; }

    .btn-branco {
      background: #FFFFFF;
      color: var(--ink-primary);
      border: 2px solid #CBD5E1;
      box-shadow: 0 4px 0 #CBD5E1;
    }
    .btn-branco:active { box-shadow: 0 1px 0 #CBD5E1; }

    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-initials {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--azul-fundo);
      color: var(--azul);
      border: 2px solid rgba(37, 99, 235, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      padding: 11px 14px;
    }
    .search-box:focus-within { border-color: var(--azul); }
    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-primary);
      width: 100%;
    }

    .filter-chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-chips-row::-webkit-scrollbar { height: 0px; }

    .filter-chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-chip.active {
      background: var(--ink-primary);
      border-color: var(--ink-primary);
      color: #FFFFFF;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-secondary);
    }

    .clean-text-input, .clean-select, .clean-textarea {
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #CBD5E1;
      background: var(--bg-app);
      color: var(--ink-primary);
      width: 100%;
      outline: none;
    }
    .clean-text-input:focus, .clean-select:focus, .clean-textarea:focus {
      border-color: var(--azul);
      background: #fff;
    }

    .prof-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .prof-avatar {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: var(--ink-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .prof-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink-primary);
    }

    .prof-subtitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-secondary);
      margin-top: 2px;
    }

    .fin-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: 20px;
      border-width: 2px;
      border-style: solid;
    }
    .fin-card-verde { background: var(--verde-fundo); border-color: var(--verde); }
    .fin-card-amarelo { background: var(--amarelo-fundo); border-color: var(--amarelo); cursor: pointer; }

    .fin-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .fin-label { font-size: 15px; font-weight: 800; color: var(--ink-secondary); }
    .fin-value { font-size: 26px; font-weight: 800; line-height: 1.1; margin-top: 3px; }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .mood-pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      padding-top: 4px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .bar-track {
      width: 100%;
      height: 106px;
      background: var(--bg-app);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border: 2px solid var(--border-subtle);
    }

    .bar-fill { width: 100%; border-radius: 12px; transition: height 0.4s ease; }

    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick-square-btn {
      min-height: 122px;
      padding: 15px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
    }
    .quick-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .quick-circle-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .quick-title { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }

    .bottom-tab-bar {
      height: 80px;
      background: #FFFFFF;
      border-top: 2px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 6px 12px 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 7px 2px;
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink-secondary);
      font-size: 11px;
      font-weight: 800;
      transition: all 0.15s ease;
    }
    .tab-btn.active { background: var(--azul); color: #FFFFFF; }

    .crm-tabs { display: flex; gap: 6px; }
    .crm-tab-btn {
      flex: 1;
      border: 2px solid var(--border-subtle);
      background: #FFFFFF;
      border-radius: 15px;
      padding: 9px 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--ink-primary);
      font-weight: 800;
      font-size: 13px;
    }
    .crm-tab-btn.active-combinando,
    .crm-tab-btn.active-prontoCobrar {
      background: var(--amarelo);
      border-color: var(--amarelo-escuro);
      color: #fff;
    }
    .crm-tab-btn.active-fazendo {
      background: var(--azul);
      border-color: var(--azul-escuro);
      color: #fff;
    }
    .crm-badge {
      background: rgba(15, 23, 42, 0.12);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
    }

    .wizard-modal {
      position: absolute;
      inset: 0;
      background: var(--bg-app);
      z-index: 50;
      display: none;
      flex-direction: column;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .wizard-modal.open { display: flex; }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0%); }
    }

    .wizard-topbar {
      padding: 46px 16px 12px 16px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .close-btn {
      border: none;
      background: var(--vermelho-fundo);
      color: var(--vermelho-escuro);
      font-size: 13px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .steps-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #FFFFFF;
      border-bottom: 2px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .step-pill {
      flex: 1;
      padding: 9px 6px;
      border-radius: 12px;
      background: var(--bg-app);
      color: var(--ink-secondary);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }
    .step-pill.active { background: var(--azul); color: #FFFFFF; }
    .step-pill.done { background: var(--verde); color: #FFFFFF; }

    .pos-display {
      background: var(--verde-fundo);
      border: 2.5px solid var(--verde);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .pos-currency { font-size: 24px; font-weight: 800; color: var(--verde-escuro); }
    .pos-digits { font-size: 36px; font-weight: 800; color: var(--verde-escuro); }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .key-btn {
      height: 52px;
      border-radius: 14px;
      border: 2px solid var(--border-subtle);
      background: var(--bg-app);
      font-size: 22px;
      font-weight: 800;
      color: var(--ink-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #CBD5E1;
    }
    .key-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #CBD5E1; }
    .key-btn.backspace {
      background: var(--vermelho);
      color: #fff;
      border-color: var(--vermelho-escuro);
      box-shadow: 0 3px 0 var(--vermelho-escuro);
    }

    .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .catalog-item-btn {
      padding: 12px;
      border-radius: 14px;
      border: 2px solid var(--border-subtle);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-primary);
      cursor: pointer;
    }
    .catalog-item-btn.selected {
      background: var(--azul);
      border-color: var(--azul-escuro);
      color: #FFFFFF;
    }

    .pdf-card {
      background: #FFFFFF;
      border-radius: 20px;
      border: 2px solid #CBD5E1;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .pdf-header {
      padding: 16px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pdf-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .pdf-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pdf-total-box {
      background: var(--verde-fundo);
      border: 2px solid var(--verde);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .portfolio-photo-card {
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-subtle);
      background: #fff;
    }
    .portfolio-img-cover {
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
    }

    .log-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      background: var(--bg-app);
      border-radius: 12px;
      border-left: 4px solid var(--azul);
    }
    .log-item.material { border-left-color: var(--amarelo); }
    .log-item.avanco { border-left-color: var(--verde); }

    .toast-banner {
      position: absolute;
      bottom: 92px;
      left: 16px;
      right: 16px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 95;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
    }
    .toast-banner.show { display: flex; }

    /* ========================================================
       SISTEMA RESPONSIVO MULTI-DISPOSITIVO (MOBILE FIRST)
       ======================================================== */

    /* Scrollbars discretos e suaves */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }

    .screen-content {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .filter-chips-row {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-chips-row::-webkit-scrollbar {
      display: none;
    }

    /* 1. Mobile Real (smartphones até 540px) */
    @media (max-width: 540px) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        background: var(--bg-app) !important;
        justify-content: flex-start !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
      }

      .preview-toolbar {
        display: none !important;
      }

      .iphone-frame {
        width: 100vw !important;
        max-width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }

      .ios-status-bar {
        display: none !important;
      }

      .screen-content {
        padding: 12px 14px 20px 14px !important;
        gap: 12px !important;
      }

      .bottom-tab-bar {
        padding-bottom: max(10px, env(safe-area-inset-bottom, 10px)) !important;
        height: auto !important;
        min-height: 60px !important;
        padding-left: 4px !important;
        padding-right: 4px !important;
      }

      .tab-btn {
        padding: 6px 2px !important;
        min-width: 0 !important;
      }

      .tab-btn span {
        font-size: 10px !important;
        letter-spacing: -0.2px !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        max-width: 100% !important;
      }

      .tab-btn i, .tab-btn svg {
        width: 18px !important;
        height: 18px !important;
      }

      /* Grid de ações rápidas no celular */
      .quick-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
      }

      .quick-square-btn {
        min-height: 98px !important;
        padding: 11px !important;
        border-radius: 14px !important;
      }

      .quick-title {
        font-size: 13px !important;
        line-height: 1.15 !important;
      }

      .quick-circle-icon {
        width: 34px !important;
        height: 34px !important;
        border-radius: 10px !important;
      }

      .quick-circle-icon i, .quick-circle-icon svg {
        width: 18px !important;
        height: 18px !important;
      }

      /* Cartões no celular */
      .accessible-card {
        padding: 14px !important;
        border-radius: 16px !important;
      }

      .fin-card {
        padding: 13px 14px !important;
        border-radius: 16px !important;
        gap: 12px !important;
      }

      .fin-icon-box {
        width: 44px !important;
        height: 44px !important;
        border-radius: 12px !important;
      }

    function carregarEstado() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return Object.assign({}, defaultState, parsed);
        }
      } catch (e) {
        console.error("Erro ao ler localStorage", e);
      }
      return JSON.parse(JSON.stringify(defaultState));
    }

    let state = carregarEstado();

    // Configuração da API Hostinger (entendalegal.com)
    const API_URL = "https://entendalegal.com/api.php";
    let syncTimeout = null;

    function persistirEstado(sincronizarRemoto = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Erro ao salvar localStorage", e);
      }

      if (sincronizarRemoto) {
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(sincronizarComBancoHostinger, 1200);
      }
    }

    async function sincronizarComBancoHostinger() {
      try {
        const resp = await fetch(`${API_URL}?action=salvar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ state: state })
        });
        if (resp.ok) {
          const res = await resp.json();
          console.log("[Hostinger MySQL] Sincronizado:", res);
        }
      } catch (err) {
        // Se a API ainda não estiver hospedada em entendalegal.com, mantém os dados no localStorage com total segurança
        console.log("[Hostinger MySQL] Operando em modo seguro local até o upload do api.php.");
      }
    }

    async function carregarDadosDoBancoHostinger() {
      try {
        const resp = await fetch(`${API_URL}?action=obter`);
        if (resp.ok) {
          const res = await resp.json();
          if (res.status === "success" && res.state) {
            state = Object.assign({}, defaultState, res.state);
            persistirEstado(false);
            renderizarTelaPrincipal();
    carregarDadosDoBancoHostinger();
            console.log("[Hostinger MySQL] Dados carregados da nuvem com sucesso!");
          }
        }
      } catch (e) {}
    }

    window.addEventListener("storage", (ev) => {
      if (ev.key === STORAGE_KEY && ev.newValue) {
        try {
          state = JSON.parse(ev.newValue);
          renderizarTelaPrincipal();
        } catch (e) {}
      }
    });

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      });
    }

    function obterIniciais(nome) {
      const partes = (nome || "Cliente").trim().split(/\s+/);
      if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
      return (nome || "CL").slice(0, 2).toUpperCase();
    }

    function obterCliente(clienteId) {
      return state.clientes.find(c => c.id === clienteId) || state.clientes[0] || { nome: "Cliente", apelidoOuBairro: "-", telefone: "-", iniciais: "CL" };
    }

    function valorPagoDoServico(s) {
      return (s.parcelas || []).filter(p => p.pago).reduce((acc, p) => acc + p.valor, 0);
    }

    function valorFaltaDoServico(s) {
      return (s.parcelas || []).filter(p => !p.pago).reduce((acc, p) => acc + p.valor, 0);
    }

    function servicoTemAtraso(s) {
      return (s.parcelas || []).some(p => !p.pago && p.atrasada);
    }

    function totalNoBolso() {
      const base = state.servicos
        .filter(s => s.status !== "combinando")
        .reduce((acc, s) => acc + valorPagoDoServico(s), 0);
      if (state.filtros.periodoDashboard === "ultimos3Meses") return base * 3 - 450;
      if (state.filtros.periodoDashboard === "anoTodo") return base * 9 + 1200;
      return base;
    }

    function totalParaReceber() {
      return state.servicos
        .filter(s => s.status === "prontoCobrar" || s.status === "fazendo")
        .reduce((acc, s) => acc + valorFaltaDoServico(s), 0);
    }

    function totalAtrasado() {
      return state.servicos
        .filter(s => s.status !== "combinando")
        .reduce((acc, s) => {
          const somaAtr = (s.parcelas || []).filter(p => !p.pago && p.atrasada).reduce((a, b) => a + b.valor, 0);
          return acc + somaAtr;
        }, 0);
    }

    function totalDespesas() {
      return state.despesas.reduce((acc, d) => acc + d.valor, 0);
    }

      if (!item.logs) item.logs = [];
      const agora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

      if (item.status === "combinando") {
        item.status = "fazendo";
        item.logs.unshift({ id: "log_" + Date.now(), dataHora: `Hoje, ${agora}`, texto: "Orçamento aprovado. Serviço em andamento.", tipo: "avanco" });

        mostrarToast("Serviço iniciado! Movido para Fazendo");
      } else if (item.status === "fazendo") {
        item.status = "prontoCobrar";
        item.logs.unshift({ id: "log_" + Date.now(), dataHora: `Hoje, ${agora}`, texto: "Serviço concluído na obra. Pronto para cobrança.", tipo: "avanco" });
        state.filtros.crmAba = "prontoCobrar";

      persistirEstado();
      renderizarTelaPrincipal();

                <span style="font-size: 13px; font-weight: 800; color: var(--ink-secondary);">Valor Total</span>
                <div style="font-size: 12px; font-weight: 700; color: var(--verde-escuro);">${(servico.parcelas || []).length}x parcela(s)</div>
              </div>
              <span style="font-size: 22px; font-weight: 800; color: var(--verde-escuro);">${formatarMoeda(servico.valor)}</span>
            </div>

            <div style="background:var(--bg-app); border:1.5px solid var(--border-subtle); border-radius:12px; padding:9px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <div style="display:flex; align-items:center; gap:8px; overflow:hidden;">
                <i data-lucide="file-text" style="width:15px; height:15px; color:var(--azul); flex-shrink:0;"></i>
                <span style="font-size:12px; font-weight:700; color:var(--ink-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                  ${ultimoLog ? `${ultimoLog.dataHora}: ${ultimoLog.texto}` : 'Nenhum log registrado ainda'}
                </span>
              </div>
              <button onclick="abrirModalEditarServico('${servico.id}', true)" style="border:none; background:transparent; color:var(--azul); font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;">
                + Log (${qtdLogs})
              </button>
            </div>

            ${botaoAcaoHTML}
          </div>
        `;
      }).join("");

      return `
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:21px; font-weight:800;">Quadro de Serviços</div>
          <button class="btn-physical btn-amarelo" style="width:auto; padding:8px 12px; font-size:13px;" onclick="abrirWizard('orcamento')">
            <i data-lucide="plus" style="width:15px; height:15px;"></i>
            <span>Novo Orçamento</span>
          </button>
        </div>

        <div class="crm-tabs">
          <button class="crm-tab-btn ${aba === 'combinando' ? 'active-combinando' : ''}" onclick="mudarAbaCRM('combinando')">
            <div style="display:flex; align-items:center; gap:5px;">
              <i data-lucide="message-square" style="width:16px; height:16px;"></i>
              <span class="crm-badge">${qtdCombinando}</span>
            </div>
            <div>Combinando</div>
          </button>
          <button class="crm-tab-btn ${aba === 'fazendo' ? 'active-fazendo' : ''}" onclick="mudarAbaCRM('fazendo')">
            <div style="display:flex; align-items:center; gap:5px;">
              <i data-lucide="hammer" style="width:16px; height:16px;"></i>
              <span class="crm-badge">${qtdFazendo}</span>
            </div>
            <div>Fazendo</div>
          </button>
          <button class="crm-tab-btn ${aba === 'prontoCobrar' ? 'active-prontoCobrar' : ''}" onclick="mudarAbaCRM('prontoCobrar')">
            <div style="display:flex; align-items:center; gap:5px;">
              <i data-lucide="dollar-sign" style="width:16px; height:16px;"></i>
              <span class="crm-badge">${qtdPronto}</span>
            </div>
            <div>Pronto/Cobrar</div>
          </button>
        </div>

        <div class="search-box">
          <i data-lucide="search" style="width:18px; height:18px; color:var(--ink-secondary);"></i>
          <input placeholder="Buscar por cliente ou serviço..." value="${state.filtros.crmBusca}" oninput="state.filtros.crmBusca=this.value; persistirEstado(); renderizarTelaPrincipal();" />
          ${state.filtros.crmBusca ? `<button onclick="state.filtros.crmBusca=''; persistirEstado(); renderizarTelaPrincipal();" style="border:none; background:none; cursor:pointer; color:var(--ink-secondary);"><i data-lucide="x" style="width:16px; height:16px;"></i></button>` : ''}
        </div>

        <div class="filter-chips-row">
          ${categorias.map(cat => `
            <button class="filter-chip ${catFiltro === cat ? 'active' : ''}" onclick="state.filtros.crmCategoria='${cat}'; persistirEstado(); renderizarTelaPrincipal();">
              ${cat === 'todas' ? 'Todas Categorias' : cat}
            </button>
          `).join("")}
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; padding:0 4px;">
          <span style="font-size:13px; font-weight:800; color:var(--ink-secondary);">${lista.length} serviço(s)</span>
          <span style="font-size:15px; font-weight:800; color:var(--ink-primary);">Total: ${formatarMoeda(somaAba)}</span>
        </div>

        ${cardsHTML || `<div class="accessible-card" style="text-align:center; font-size:16px; font-weight:800; color:var(--ink-secondary);">Nenhum serviço encontrado para este filtro.</div>`}
      `;
    }

    let servicoEmEdicaoId = null;

    function abrirModalEditarServico(servicoId, focarNoLog = false) {
      servicoEmEdicaoId = servicoId;
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      if (!servico.logs) servico.logs = [];

      renderizarModalEditarServico(servico);
      document.getElementById("editarServicoModal").classList.add("open");
      atualizarIcones();
      if (focarNoLog) {
        setTimeout(() => {
          const inp = document.getElementById("novoLogInput");
          if (inp) inp.focus();
        }, 300);
      }
    }

    function fecharModalEditarServico() {
      document.getElementById("editarServicoModal").classList.remove("open");
      servicoEmEdicaoId = null;
      renderizarTelaPrincipal();
    }

    function renderizarModalEditarServico(servico) {
      const cli = obterCliente(servico.clienteId);
      const categorias = ["Pintura", "Elétrica", "Alvenaria", "Encanamento", "Telhado", "Jardim", "Geral"];

      const logsHTML = (servico.logs || []).map(l => `
        <div class="log-item ${l.tipo || 'nota'}">
          <div style="flex:1;">
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:11px; font-weight:800; color:var(--ink-secondary);">${l.dataHora}</span>
              <button onclick="removerLogServico('${servico.id}', '${l.id}')" style="border:none; background:none; color:var(--vermelho); cursor:pointer;">
                <i data-lucide="trash" style="width:14px; height:14px;"></i>
              </button>
            </div>
            <div style="font-size:14px; font-weight:700; color:var(--ink-primary); margin-top:2px;">${l.texto}</div>
          </div>
        </div>
      `).join("");

      const parcelasHTML = (servico.parcelas || []).map(p => `
        <div style="background:var(--bg-app); border:1.5px solid var(--border-subtle); border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div>
            <div style="font-size:14px; font-weight:800;">${p.numero}ª Parcela: ${formatarMoeda(p.valor)}</div>
            <div style="font-size:12px; font-weight:700; color:${p.pago ? 'var(--verde-escuro)' : (p.atrasada ? 'var(--vermelho-escuro)' : 'var(--ink-secondary)')};">
              ${p.vencimentoTexto} • ${p.pago ? 'PAGA' : (p.atrasada ? 'ATRASADA' : 'PENDENTE')}
            </div>
          </div>
          <button onclick="abrirModalEditarParcela('${servico.id}', '${p.id}')" style="border:none; background:var(--azul); color:#fff; padding:6px 10px; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer;">
            Editar
          </button>
        </div>
      `).join("");

      document.getElementById("editarServicoBody").innerHTML = `
        <div class="accessible-card" style="display:flex; flex-direction:column; gap:12px;">
          <div style="font-size:17px; font-weight:800;">Dados do Serviço</div>

          <div class="form-group">
            <label class="form-label">Título do Serviço</label>
            <input id="editServTitulo" class="clean-text-input" value="${servico.tituloServico}" />
          </div>

          <div class="form-group">
            <label class="form-label">Cliente</label>
            <select id="editServCliente" class="clean-select">
              ${state.clientes.map(c => `<option value="${c.id}" ${c.id === servico.clienteId ? 'selected' : ''}>${c.nome} (${c.apelidoOuBairro})</option>`).join("")}
            </select>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label class="form-label">Categoria</label>
              <select id="editServCat" class="clean-select">
                ${categorias.map(cat => `<option value="${cat}" ${cat === servico.categoria ? 'selected' : ''}>${cat}</option>`).join("")}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Valor Total (R$)</label>
              <input id="editServValor" class="clean-text-input" type="number" value="${servico.valor}" />
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label class="form-label">Forma de Pagamento</label>
              <select id="editServMetodo" class="clean-select">
                <option value="Pix" ${servico.metodoPagamento === 'Pix' ? 'selected' : ''}>Pix</option>
                <option value="Dinheiro" ${servico.metodoPagamento === 'Dinheiro' ? 'selected' : ''}>Dinheiro</option>
                <option value="Cartão" ${servico.metodoPagamento === 'Cartão' ? 'selected' : ''}>Cartão</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Status no CRM</label>
              <select id="editServStatus" class="clean-select">
                <option value="combinando" ${servico.status === 'combinando' ? 'selected' : ''}>Combinando</option>
                <option value="fazendo" ${servico.status === 'fazendo' ? 'selected' : ''}>Fazendo</option>
                <option value="prontoCobrar" ${servico.status === 'prontoCobrar' ? 'selected' : ''}>Pronto / Cobrar</option>
                <option value="pago" ${servico.status === 'pago' ? 'selected' : ''}>No Bolso (Pago)</option>
              </select>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label class="form-label">Dia da Agenda</label>
              <select id="editServDia" class="clean-select">
                <option value="HOJE" ${servico.diaAgenda === 'HOJE' ? 'selected' : ''}>Hoje</option>
                <option value="AMANHÃ" ${servico.diaAgenda === 'AMANHÃ' ? 'selected' : ''}>Amanhã</option>
                <option value="SEMANA" ${servico.diaAgenda === 'SEMANA' ? 'selected' : ''}>Esta Semana</option>
                <option value="PAGO" ${servico.diaAgenda === 'PAGO' ? 'selected' : ''}>Finalizado</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Horário Marcado</label>
              <input id="editServHora" class="clean-text-input" value="${servico.horaAgenda || '09:00'}" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Observações / Detalhes</label>
            <textarea id="editServObs" class="clean-textarea" rows="2">${servico.observacao || ''}</textarea>
          </div>

          <button class="btn-physical btn-verde" onclick="salvarEdicaoServico('${servico.id}')">
            <i data-lucide="check" style="width:18px; height:18px;"></i>
            <span>Salvar Alterações do Serviço</span>
          </button>
        </div>

        <div class="accessible-card" style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="font-size:17px; font-weight:800;">Diário de Bordo & Logs</div>
            <span style="font-size:12px; font-weight:800; background:var(--azul-fundo); color:var(--azul); padding:3px 9px; border-radius:999px;">${(servico.logs || []).length} logs</span>
          </div>

          <div style="display:flex; gap:6px;">
            <input id="novoLogInput" class="clean-text-input" placeholder="Ex: Comprou fiação extra de 10m" style="flex:1;" />
            <select id="novoLogTipo" class="clean-select" style="width:110px;">
              <option value="avanco">Avanço</option>
              <option value="material">Material</option>
              <option value="nota">Nota</option>
            </select>
            <button onclick="adicionarLogAoServico('${servico.id}')" style="border:none; background:var(--azul); color:#fff; padding:0 14px; border-radius:14px; font-weight:800; cursor:pointer;">
              <i data-lucide="plus" style="width:18px; height:18px;"></i>
            </button>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
            ${logsHTML || '<div style="font-size:13px; font-weight:700; color:var(--ink-secondary); text-align:center;">Nenhum registro no diário deste serviço.</div>'}
          </div>
        </div>

        <div class="accessible-card" style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="font-size:17px; font-weight:800;">Parcelas do Pagamento</div>
            <button onclick="adicionarParcelaAoServico('${servico.id}')" style="border:none; background:var(--verde); color:#fff; padding:6px 12px; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer;">
              + Parcela
            </button>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${parcelasHTML}
          </div>
        </div>

        <button class="btn-physical btn-vermelho" onclick="excluirServico('${servico.id}'); fecharModalEditarServico();" style="margin-top:6px;">
          <i data-lucide="trash-2" style="width:18px; height:18px;"></i>
          <span>Excluir Serviço Permanentemente</span>
        </button>
      `;
      atualizarIcones();
    }

    function salvarEdicaoServico(servicoId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;

      const titulo = document.getElementById("editServTitulo").value.trim() || servico.tituloServico;
      const clienteId = document.getElementById("editServCliente").value;
      const categoria = document.getElementById("editServCat").value;
      const valor = parseInt(document.getElementById("editServValor").value || "0", 10);
      const metodo = document.getElementById("editServMetodo").value;
      const status = document.getElementById("editServStatus").value;
      const dia = document.getElementById("editServDia").value;
      const hora = document.getElementById("editServHora").value.trim() || "09:00";
      const obs = document.getElementById("editServObs").value.trim();

      servico.tituloServico = titulo;
      servico.clienteId = clienteId;
      servico.categoria = categoria;
      servico.valor = valor;
      servico.metodoPagamento = metodo;
      servico.status = status;
      servico.diaAgenda = dia;
      servico.horaAgenda = hora;
      servico.observacao = obs;

      if (status === "pago") {
        (servico.parcelas || []).forEach(p => { p.pago = true; p.atrasada = false; p.vencimentoTexto = "Pago"; });
      }

      persistirEstado();
      mostrarToast("Serviço e detalhes salvos com sucesso");
      fecharModalEditarServico();
    }

    function adicionarLogAoServico(servicoId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      if (!servico.logs) servico.logs = [];

      const texto = (document.getElementById("novoLogInput").value || "").trim();
      const tipo = document.getElementById("novoLogTipo").value;
      if (!texto) {
        mostrarToast("Digite a nota do log");
        return;
      }

      const agora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      servico.logs.unshift({
        id: "log_" + Date.now(),
        dataHora: `Hoje, ${agora}`,
        texto: texto,
        tipo: tipo
      });

      persistirEstado();
      mostrarToast("Novo log adicionado!");
      renderizarModalEditarServico(servico);
    }

    function removerLogServico(servicoId, logId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico || !servico.logs) return;
      servico.logs = servico.logs.filter(l => l.id !== logId);
      persistirEstado();
      mostrarToast("Log removido");
      renderizarModalEditarServico(servico);
    }

    function adicionarParcelaAoServico(servicoId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      if (!servico.parcelas) servico.parcelas = [];

      const novoNum = servico.parcelas.length + 1;
      const valorPadrao = Math.round(servico.valor / novoNum) || 100;
      servico.parcelas.push({
        id: "parc_" + Date.now() + "_" + novoNum,
        numero: novoNum,
        totalParcelas: novoNum,
        valor: valorPadrao,
        vencimentoTexto: `${novoNum}ª Parcela`,
        pago: false,
        atrasada: false
      });
      servico.parcelas.forEach(p => p.totalParcelas = servico.parcelas.length);

      persistirEstado();
      mostrarToast("Nova parcela adicionada");
      renderizarModalEditarServico(servico);
    }

    let parcelaEmEdicao = null;

    function abrirModalEditarParcela(servicoId, parcelaId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      const parcela = (servico.parcelas || []).find(p => p.id === parcelaId);
      if (!parcela) return;

      parcelaEmEdicao = { servicoId, parcelaId };

      document.getElementById("editarParcelaBody").innerHTML = `
        <div class="accessible-card" style="display:flex; flex-direction:column; gap:12px;">
          <div style="font-size:17px; font-weight:800;">Editar Parcela ${parcela.numero} de ${parcela.totalParcelas}</div>

          <div class="form-group">
            <label class="form-label">Valor desta Parcela (R$)</label>
            <input id="editParcValor" class="clean-text-input" type="number" value="${parcela.valor}" />
          </div>

          <div class="form-group">
            <label class="form-label">Texto de Vencimento / Data</label>
            <input id="editParcVenc" class="clean-text-input" value="${parcela.vencimentoTexto}" placeholder="Ex: Vence HOJE, Dia 15/11..." />
          </div>

          <div class="form-group">
            <label class="form-label">Status do Pagamento</label>
            <select id="editParcStatus" class="clean-select">
              <option value="pago" ${parcela.pago ? 'selected' : ''}>PAGO (Já Recebi no Bolso)</option>
              <option value="pendente" ${!parcela.pago && !parcela.atrasada ? 'selected' : ''}>PENDENTE (Aguardando Data)</option>
              <option value="atrasada" ${!parcela.pago && parcela.atrasada ? 'selected' : ''}>ATRASADA (Conta Vencida)</option>
            </select>
          </div>

          <button class="btn-physical btn-verde" onclick="salvarEdicaoParcela()">
            <i data-lucide="check" style="width:18px; height:18px;"></i>
            <span>Salvar Parcela</span>
          </button>

          <button class="btn-physical btn-vermelho" onclick="excluirParcela()">
            <i data-lucide="trash-2" style="width:18px; height:18px;"></i>
            <span>Excluir Esta Parcela</span>
          </button>
        </div>
      `;

      document.getElementById("editarParcelaModal").classList.add("open");
      atualizarIcones();
    }

    function fecharModalEditarParcela() {
      document.getElementById("editarParcelaModal").classList.remove("open");
      parcelaEmEdicao = null;
      if (servicoEmEdicaoId) {
        const s = state.servicos.find(x => x.id === servicoEmEdicaoId);
        if (s) renderizarModalEditarServico(s);
      } else {
        renderizarTelaPrincipal();
      }
    }

    function salvarEdicaoParcela() {
      if (!parcelaEmEdicao) return;
      const servico = state.servicos.find(s => s.id === parcelaEmEdicao.servicoId);
      if (!servico) return;
      const parcela = (servico.parcelas || []).find(p => p.id === parcelaEmEdicao.parcelaId);
      if (!parcela) return;

      const valor = parseInt(document.getElementById("editParcValor").value || "0", 10);
      const venc = document.getElementById("editParcVenc").value.trim() || parcela.vencimentoTexto;
      const st = document.getElementById("editParcStatus").value;

      parcela.valor = valor;
      parcela.vencimentoTexto = venc;
      if (st === "pago") {
        parcela.pago = true;
        parcela.atrasada = false;
      } else if (st === "atrasada") {
        parcela.pago = false;
        parcela.atrasada = true;
      } else {
        parcela.pago = false;
        parcela.atrasada = false;
      }

      const todasPagas = servico.parcelas.every(p => p.pago);
      if (todasPagas) servico.status = "pago";

      persistirEstado();
      mostrarToast("Parcela atualizada!");
      fecharModalEditarParcela();
    }

    function excluirParcela() {
      if (!parcelaEmEdicao) return;
      const servico = state.servicos.find(s => s.id === parcelaEmEdicao.servicoId);
      if (!servico) return;

      if ((servico.parcelas || []).length <= 1) {
        mostrarToast("O serviço deve ter ao menos 1 parcela");
        return;
      }

      servico.parcelas = servico.parcelas.filter(p => p.id !== parcelaEmEdicao.parcelaId);
      servico.parcelas.forEach((p, idx) => {
        p.numero = idx + 1;
        p.totalParcelas = servico.parcelas.length;
      });

      persistirEstado();
      mostrarToast("Parcela removida");
      fecharModalEditarParcela();
    }

    function mudarFiltroFinanceiro(filtro) {
      state.filtros.finAba = filtro;
      persistirEstado();
      renderizarTelaPrincipal();
    }

    function receberParcelaIndividual(servicoId, parcelaId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      const parcela = (servico.parcelas || []).find(p => p.id === parcelaId);
      if (!parcela) return;

      parcela.pago = true;
      parcela.atrasada = false;
      parcela.vencimentoTexto = "Pago";

      if (!servico.logs) servico.logs = [];
      const agora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      servico.logs.unshift({
        id: "log_" + Date.now(),
        dataHora: `Hoje, ${agora}`,
        texto: `Recebido ${formatarMoeda(parcela.valor)} referente à ${parcela.numero}ª parcela`,
        tipo: "avanco"
      });

      const todasPagas = servico.parcelas.every(p => p.pago);
      if (todasPagas) servico.status = "pago";

      persistirEstado();
      mostrarToast(`+ ${formatarMoeda(parcela.valor)} recebido no bolso!`);
      renderizarTelaPrincipal();
    }

    function cobrarParcelaNoZap(servicoId, parcelaId) {
      const servico = state.servicos.find(s => s.id === servicoId);
      if (!servico) return;
      const cli = obterCliente(servico.clienteId);
      mostrarToast(`Cobrança enviada para ${cli.nome} no WhatsApp`);
    }

    function salvarNovaCobrancaAvulsa() {
      const titulo = state.forms.cobTitulo.trim() || "Serviço Avulso";
      const valor = parseInt(state.forms.cobValor || "0", 10);
      if (valor <= 0) {
        mostrarToast("Digite um valor válido");
        return;
      }
      const qtd = parseInt(state.forms.cobParcelas || 1, 10);
      const valCada = Math.round(valor / qtd);

      const novasParcelas = Array.from({ length: qtd }, (_, i) => ({
        id: "parc_av_" + Date.now() + "_" + i,
        numero: i + 1,
        totalParcelas: qtd,
        valor: valCada,
        vencimentoTexto: i === 0 ? "Vence HOJE" : `${i + 1}ª Parcela`,
        pago: false,
        atrasada: false
      }));

      state.servicos.unshift({
        id: "srv_av_" + Date.now(),
        clienteId: state.forms.cobClienteId,
        tituloServico: titulo,
        categoria: "Geral",
        icone: "wrench",
        valor: valor,
        diaAgenda: "HOJE",
        horaAgenda: "12:00",
        metodoPagamento: state.forms.cobMetodo,
        status: "prontoCobrar",
        temFotoAnexa: false,
        observacao: "",
        logs: [
          { id: "log_" + Date.now(), dataHora: "Hoje", texto: "Cobrança avulsa criada", tipo: "nota" }
        ],
        parcelas: novasParcelas
      });

      state.forms.mostrarFormCobrancaAvulsa = false;
      state.forms.cobTitulo = "";
      state.forms.cobValor = "";
      persistirEstado();
      mostrarToast("Nova cobrança parcelada registrada");
      renderizarTelaPrincipal();
    }

    function abrirEdicaoDespesa(id = null) {
      if (id) {
        const d = state.despesas.find(x => x.id === id);
        if (d) {
          state.forms.despesaEditandoId = d.id;
          state.forms.despTitulo = d.titulo;
          state.forms.despValor = String(d.valor);
          state.forms.despCategoria = d.categoria;
        }
      } else {
        state.forms.despesaEditandoId = null;
        state.forms.despTitulo = "";
        state.forms.despValor = "";
        state.forms.despCategoria = "Material";
      }
      state.forms.mostrarFormDespesa = true;
      state.forms.mostrarFormCobrancaAvulsa = false;
      renderizarTelaPrincipal();
    }

    function salvarNovaDespesa() {
      const titulo = state.forms.despTitulo.trim();
      const valor = parseInt(state.forms.despValor || "0", 10);
      if (!titulo || valor <= 0) {
        mostrarToast("Preencha descrição e valor da despesa");
        return;
      }

      if (state.forms.despesaEditandoId) {
        const d = state.despesas.find(x => x.id === state.forms.despesaEditandoId);
        if (d) {
          d.titulo = titulo;
          d.valor = valor;
          d.categoria = state.forms.despCategoria;
        }
        mostrarToast("Gasto atualizado!");
      } else {
        state.despesas.unshift({
          id: "desp_" + Date.now(),
          titulo: titulo,
          categoria: state.forms.despCategoria,
          valor: valor,
          data: "Hoje"
        });
        mostrarToast("Gasto registrado");
      }

      state.forms.mostrarFormDespesa = false;
      state.forms.despesaEditandoId = null;
      state.forms.despTitulo = "";
      state.forms.despValor = "";
      state.filtros.finAba = "despesas";
      persistirEstado();
      renderizarTelaPrincipal();
    }

    function excluirDespesa(id) {
      if (!confirm("Excluir este gasto?")) return;
      state.despesas = state.despesas.filter(d => d.id !== id);
      persistirEstado();
      mostrarToast("Gasto excluído");
      renderizarTelaPrincipal();
    }

    function renderFinanceiroHTML() {
      const bolso = totalNoBolso();
      const receber = totalParaReceber();
      const atrasado = totalAtrasado();
      const gastos = totalDespesas();
      const lucroLiquido = bolso - gastos;
      const f = state.filtros.finAba;
      const busca = (state.filtros.finBusca || "").toLowerCase();
      const metodo = state.filtros.finMetodo;

      let servicosFiltrados = [];
      if (f === "faltaReceber") {
        servicosFiltrados = state.servicos.filter(s => s.status !== "combinando" && valorFaltaDoServico(s) > 0);
      } else if (f === "atrasados") {
        servicosFiltrados = state.servicos.filter(s => s.status !== "combinando" && servicoTemAtraso(s));
      } else if (f === "noBolso") {
        servicosFiltrados = state.servicos.filter(s => s.status !== "combinando" && valorPagoDoServico(s) > 0);
      }

      servicosFiltrados = servicosFiltrados.filter(s => {
        const cli = obterCliente(s.clienteId);
        const bateBusca = !busca || cli.nome.toLowerCase().includes(busca) || s.tituloServico.toLowerCase().includes(busca);
        const bateMetodo = metodo === "todos" || (s.metodoPagamento || "Pix") === metodo;
        return bateBusca && bateMetodo;
      });

      const formCobrancaHTML = state.forms.mostrarFormCobrancaAvulsa ? `

            <span style="font-size:17px; font-weight:800;">Nova Cobrança / Parcelamento</span>
            <button onclick="state.forms.mostrarFormCobrancaAvulsa=false; renderizarTelaPrincipal();" style="border:none; background:none; cursor:pointer;"><i data-lucide="x" style="width:18px; height:18px;"></i></button>
          </div>

          <div class="form-group">
            <label class="form-label">Cliente</label>
            <select class="clean-select" onchange="state.forms.cobClienteId=this.value">
              ${state.clientes.map(c => `<option value="${c.id}" ${state.forms.cobClienteId===c.id?'selected':''}>${c.nome}</option>`).join("")}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Descrição do Serviço</label>
            <input class="clean-text-input" placeholder="Ex: Instalação de Ventilador" value="${state.forms.cobTitulo}" oninput="state.forms.cobTitulo=this.value" />
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label class="form-label">Valor Total (R$)</label>
              <input class="clean-text-input" type="number" placeholder="300" value="${state.forms.cobValor}" oninput="state.forms.cobValor=this.value" />
            </div>
            <div class="form-group">
              <label class="form-label">Parcelas</label>
              <select class="clean-select" onchange="state.forms.cobParcelas=this.value">

                <option value="2">2x Parcelado</option>
                <option value="3">3x Parcelado</option>
                <option value="4">4x Parcelado</option>

          <div class="form-group">
            <label class="form-label">Forma de Pagamento</label>
            <select class="clean-select" onchange="state.forms.cobMetodo=this.value">

              <option value="Dinheiro">Dinheiro</option>
              <option value="Cartão">Cartão</option>

          <button class="btn-physical btn-verde" onclick="salvarNovaCobrancaAvulsa()">

            <span>Salvar Cobrança</span>
          </button>
        </div>
      ` : "";

      const formDespesaHTML = state.forms.mostrarFormDespesa ? `
        <div class="accessible-card" style="border-color:var(--vermelho); display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">

            <button onclick="state.forms.mostrarFormDespesa=false; renderizarTelaPrincipal();" style="border:none; background:none; cursor:pointer;"><i data-lucide="x" style="width:18px; height:18px;"></i></button>
          </div>

          <div class="form-group">
            <label class="form-label">O que você comprou / gastou?</label>

              <label class="form-label">Valor (R$)</label>

      let conteudoListaHTML = "";

              </button>
            </div>
          </div>
        `).join("");
      } else {
        conteudoListaHTML = servicosFiltrados.map(servico => {
          const cli = obterCliente(servico.clienteId);
          const jaPagou = valorPagoDoServico(servico);
          const falta = valorFaltaDoServico(servico);
          const temAtr = servicoTemAtraso(servico);
          const qtdPagas = (servico.parcelas || []).filter(p => p.pago).length;
          const qtdTotal = (servico.parcelas || []).length;
          const corBordaCard = temAtr ? "var(--vermelho)" : (falta > 0 ? "var(--amarelo)" : "var(--verde)");

          const linhasParcelas = (servico.parcelas || []).map(p => {
            const iconeNome = p.pago ? "check-circle-2" : (p.atrasada ? "alert-circle" : "clock");
            const corIcone = p.pago ? "var(--verde)" : (p.atrasada ? "var(--vermelho)" : "var(--amarelo-escuro)");
            const bgLinha = p.pago ? "var(--verde-fundo)" : (p.atrasada ? "var(--vermelho-fundo)" : "var(--bg-app)");
            const corVenc = p.atrasada ? "var(--vermelho-escuro)" : (p.pago ? "var(--verde-escuro)" : "var(--ink-secondary)");

            return `
              <div style="background:${bgLinha}; border:1.5px solid var(--border-subtle); border-radius:14px; padding:11px; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; align-items:center; gap:9px;">
                  <i data-lucide="${iconeNome}" style="width:18px; height:18px; color:${corIcone};"></i>
                  <div style="flex:1;">
                    <div style="font-size:15px; font-weight:800;">${p.numero}ª de ${p.totalParcelas} • ${formatarMoeda(p.valor)}</div>
                    <div style="font-size:12px; font-weight:700; color:${corVenc};">${p.vencimentoTexto}</div>
                  </div>
                  <button onclick="abrirModalEditarParcela('${servico.id}', '${p.id}')" style="border:none; background:#fff; border:1px solid #CBD5E1; color:var(--ink-secondary); padding:4px 8px; border-radius:8px; font-size:11px; font-weight:800; cursor:pointer;">
                    Editar
                  </button>
                  ${p.pago ? `<span style="background:var(--verde); color:#fff; font-weight:800; font-size:11px; padding:3px 8px; border-radius:999px;">PAGO</span>` : ''}

                ${!p.pago ? `
                  <div style="display:flex; gap:8px;">
                    <button class="btn-physical btn-verde" style="padding:9px; font-size:14px; border-radius:12px;" onclick="receberParcelaIndividual('${servico.id}', '${p.id}')">
                      <i data-lucide="check" style="width:16px; height:16px;"></i>
                      <span>Recebi</span>
                    </button>
                    <button class="btn-physical ${p.atrasada ? 'btn-vermelho' : 'btn-amarelo'}" style="padding:9px; font-size:14px; border-radius:12px;" onclick="cobrarParcelaNoZap('${servico.id}', '${p.id}')">

                <div style="flex:1;">
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span style="font-size:18px; font-weight:800;">${cli.nome}</span>
                    ${temAtr ? `<span style="background:var(--vermelho); color:#fff; font-size:10px; font-weight:800; padding:2px 7px; border-radius:999px;">ATRASADO</span>` : ''}
                  </div>
                  <div style="font-size:13px; font-weight:700; color:var(--ink-secondary); margin-top:2px;">
                    ${servico.tituloServico} • ${servico.metodoPagamento || 'Pix'}

                </div>
                <button onclick="abrirModalEditarServico('${servico.id}')" style="border:none; background:var(--azul-fundo); color:var(--azul); padding:6px 10px; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer;">
                  Editar Serviço
                </button>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div style="background:var(--verde-fundo); padding:9px 11px; border-radius:12px;">
                  <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">Já Pagou</div>
                  <div style="font-size:17px; font-weight:800; color:var(--verde-escuro);">${formatarMoeda(jaPagou)}</div>
                </div>
                <div style="background:${temAtr ? 'var(--vermelho-fundo)' : 'var(--amarelo-fundo)'}; padding:9px 11px; border-radius:12px;">
                  <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">Falta Receber</div>
                  <div style="font-size:17px; font-weight:800; color:${temAtr ? 'var(--vermelho-escuro)' : 'var(--amarelo-escuro)'};">${formatarMoeda(falta)}</div>
                </div>
              </div>

              <div style="font-size:14px; font-weight:800;">Parcelas (${qtdPagas} de ${qtdTotal} pagas)</div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${linhasParcelas}
              </div>
            </div>
          `;
        }).join("");
      }

      return `
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <div style="font-size:21px; font-weight:800;">Meu Dinheiro</div>
            <div style="font-size:13px; font-weight:700; color:var(--ink-secondary);">Livre no bolso: <strong style="color:var(--verde-escuro);">${formatarMoeda(lucroLiquido)}</strong></div>
          </div>
          <div style="display:flex; gap:6px;">
            <button onclick="state.forms.mostrarFormCobrancaAvulsa=!state.forms.mostrarFormCobrancaAvulsa; state.forms.mostrarFormDespesa=false; renderizarTelaPrincipal();" style="border:none; background:var(--azul); color:#fff; padding:7px 10px; border-radius:11px; font-weight:800; font-size:12px; cursor:pointer;">+ Cobrança</button>
            <button onclick="abrirEdicaoDespesa()" style="border:none; background:var(--vermelho-fundo); color:var(--vermelho-escuro); padding:7px 10px; border-radius:11px; font-weight:800; font-size:12px; cursor:pointer;">- Gasto</button>
          </div>
        </div>

        ${formCobrancaHTML}
        ${formDespesaHTML}

        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
          <div onclick="mudarFiltroFinanceiro('noBolso')" style="cursor:pointer; background:var(--verde-fundo); border:2px solid var(--verde); border-radius:16px; padding:10px;">
            <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">Já Recebi</div>
            <div style="font-size:17px; font-weight:800; color:var(--verde-escuro); margin-top:2px;">${formatarMoeda(bolso)}</div>
          </div>
          <div onclick="mudarFiltroFinanceiro('faltaReceber')" style="cursor:pointer; background:var(--amarelo-fundo); border:2px solid var(--amarelo); border-radius:16px; padding:10px;">
            <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">Na Rua</div>
            <div style="font-size:17px; font-weight:800; color:var(--amarelo-escuro); margin-top:2px;">${formatarMoeda(receber)}</div>
          </div>
          <div onclick="mudarFiltroFinanceiro('atrasados')" style="cursor:pointer; background:var(--vermelho-fundo); border:2px solid var(--vermelho); border-radius:16px; padding:10px;">
            <div style="font-size:11px; font-weight:800; color:var(--ink-secondary);">Atrasado</div>
            <div style="font-size:17px; font-weight:800; color:var(--vermelho-escuro); margin-top:2px;">${formatarMoeda(atrasado)}</div>
          </div>
        </div>

        <div class="crm-tabs">
          <button class="crm-tab-btn" style="background:${f==='faltaReceber'?'var(--amarelo)':'#fff'}; color:${f==='faltaReceber'?'#fff':'var(--ink-primary)'};" onclick="mudarFiltroFinanceiro('faltaReceber')">
            <i data-lucide="clock" style="width:16px; height:16px;"></i>
            <div>Falta</div>
          </button>
          <button class="crm-tab-btn" style="background:${f==='atrasados'?'var(--vermelho)':'#fff'}; color:${f==='atrasados'?'#fff':'var(--ink-primary)'};" onclick="mudarFiltroFinanceiro('atrasados')">
            <i data-lucide="alert-triangle" style="width:16px; height:16px;"></i>
            <div>Atraso</div>
          </button>
          <button class="crm-tab-btn" style="background:${f==='noBolso'?'var(--verde)':'#fff'}; color:${f==='noBolso'?'#fff':'var(--ink-primary)'};" onclick="mudarFiltroFinanceiro('noBolso')">
            <i data-lucide="check-circle-2" style="width:16px; height:16px;"></i>
            <div>Recebi</div>
          </button>
          <button class="crm-tab-btn" style="background:${f==='despesas'?'var(--ink-primary)':'#fff'}; color:${f==='despesas'?'#fff':'var(--ink-primary)'};" onclick="mudarFiltroFinanceiro('despesas')">
            <i data-lucide="receipt" style="width:16px; height:16px;"></i>
            <div>Gastos</div>
          </button>
        </div>

        ${f !== 'despesas' ? `
          <div class="search-box">
            <i data-lucide="search" style="width:18px; height:18px; color:var(--ink-secondary);"></i>
            <input placeholder="Buscar cobrança por cliente..." value="${state.filtros.finBusca}" oninput="state.filtros.finBusca=this.value; persistirEstado(); renderizarTelaPrincipal();" />
          </div>
          <div class="filter-chips-row">
            ${["todos", "Pix", "Dinheiro", "Cartão"].map(m => `
              <button class="filter-chip ${metodo === m ? 'active' : ''}" onclick="state.filtros.finMetodo='${m}'; persistirEstado(); renderizarTelaPrincipal();">
                ${m === 'todos' ? 'Todas Formas' : m}
              </button>
            `).join("")}

        ` : ''}

        ${conteudoListaHTML || `<div class="accessible-card" style="text-align:center; font-size:16px; font-weight:800; color:var(--ink-secondary);">Nenhum lançamento encontrado.</div>`}
      `;

    function abrirFormNovoCliente(clienteId = null) {
      if (clienteId) {
        const cli = obterCliente(clienteId);
        state.forms.clienteEditandoId = cli.id;
        state.forms.cliNome = cli.nome;
        state.forms.cliBairro = cli.apelidoOuBairro;
        state.forms.cliTelefone = cli.telefone;
      } else {
        state.forms.clienteEditandoId = null;
        state.forms.cliNome = "";
        state.forms.cliBairro = "";
        state.forms.cliTelefone = "";
      }
      state.forms.mostrarFormCliente = true;
      renderizarTelaPrincipal();
    }

    function salvarFormularioCliente() {
      const nome = state.forms.cliNome.trim();
      if (!nome) {
        mostrarToast("Digite o nome do cliente");
        return;
      }
      if (state.forms.clienteEditandoId) {
        const cli = state.clientes.find(c => c.id === state.forms.clienteEditandoId);
        if (cli) {
          cli.nome = nome;
          cli.apelidoOuBairro = state.forms.cliBairro.trim() || "Cliente Cadastrado";
          cli.telefone = state.forms.cliTelefone.trim() || "(11) 99000-0000";
          cli.iniciais = obterIniciais(nome);
        }
        mostrarToast("Cliente atualizado");
      } else {
        state.clientes.unshift({
          id: "cli_" + Date.now(),
          nome: nome,
          apelidoOuBairro: state.forms.cliBairro.trim() || "Cliente Cadastrado",
          telefone: state.forms.cliTelefone.trim() || "(11) 99000-0000",
          iniciais: obterIniciais(nome)
        });
        mostrarToast("Novo cliente salvo");
      }
      state.forms.mostrarFormCliente = false;
      persistirEstado();
      renderizarTelaPrincipal();

    function excluirCliente(clienteId) {
      if (!confirm("Excluir este cliente?")) return;
      state.clientes = state.clientes.filter(c => c.id !== clienteId);
      persistirEstado();
      mostrarToast("Cliente excluído");
      renderizarTelaPrincipal();
    }

    function clientePossuiPendencia(clienteId) {
      return state.servicos.some(s => s.clienteId === clienteId && s.status !== "combinando" && valorFaltaDoServico(s) > 0);
    }

      const busca = (state.filtros.clientesBusca || "").toLowerCase();
      const filtro = state.filtros.clientesFiltro;

          c.nome.toLowerCase().includes(busca) ||
          c.apelidoOuBairro.toLowerCase().includes(busca) ||
          c.telefone.toLowerCase().includes(busca);
        const temPend = clientePossuiPendencia(c.id);
        if (filtro === "comPendencia" && !temPend) return false;
        if (filtro === "emDia" && temPend) return false;
        return bateBusca;

      const listaHTML = filtrados.map(c => {

                  <span style="font-size: 18px; font-weight: 800;">${c.nome}</span>
                  <span style="font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; background:${temPend?'var(--amarelo-fundo)':'var(--verde-fundo)'}; color:${temPend?'var(--amarelo-escuro)':'var(--verde-escuro)'};">

                <div style="font-size: 14px; font-weight: 700; color: var(--ink-secondary);">${c.apelidoOuBairro}</div>
                <div style="font-size: 13px; font-weight: 800; color: var(--azul); margin-top:2px;">${c.telefone}</div>
              </div>
              <div style="display:flex; gap:6px;">

                  <i data-lucide="trash-2" style="width:15px; height:15px;"></i>

              </div>

            <button class="btn-physical btn-verde" style="padding:11px 14px; font-size:15px;" onclick="abrirWizardParaCliente('${c.id}')">
              <i data-lucide="file-plus-2" style="width:18px; height:18px;"></i>
              <span>Fazer Orçamento para ${c.nome}</span>

          </div>

      }).join("");

      return `
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size: 21px; font-weight: 800;">Meus Clientes</div>
          <button class="btn-physical btn-azul" style="width:auto; padding:8px 12px; font-size:13px;" onclick="abrirFormNovoCliente()">

        <div class="filter-chips-row">
          <button class="filter-chip ${filtro === 'todos' ? 'active' : ''}" onclick="state.filtros.clientesFiltro='todos'; persistirEstado(); renderizarTelaPrincipal();">Todos (${state.clientes.length})</button>
          <button class="filter-chip ${filtro === 'comPendencia' ? 'active' : ''}" onclick="state.filtros.clientesFiltro='comPendencia'; persistirEstado(); renderizarTelaPrincipal();">Com Parcela Aberta</button>

    function fecharModalEditarAgenda() {
      document.getElementById("editarAgendaModal").classList.remove("open");
      agendaEmEdicaoId = null;
      renderizarTelaPrincipal();
    }

    function salvarEdicaoAgenda() {
      if (!agendaEmEdicaoId) return;
      const s = state.servicos.find(x => x.id === agendaEmEdicaoId);
      if (!s) return;

      s.tituloServico = document.getElementById("editAgTitulo").value.trim() || s.tituloServico;
      s.clienteId = document.getElementById("editAgCliente").value;
      s.diaAgenda = document.getElementById("editAgDia").value;
      s.horaAgenda = document.getElementById("editAgHora").value.trim() || "09:00";
      s.valor = parseInt(document.getElementById("editAgValor").value || "0", 10);

      persistirEstado();
      mostrarToast("Agenda atualizada!");
      fecharModalEditarAgenda();
    }

    function salvarNovoAgendamento() {
      const titulo = state.forms.agTitulo.trim() || "Visita Técnica / Serviço";
      const valor = parseInt(state.forms.agValor || "0", 10);
      state.servicos.unshift({
        id: "ag_" + Date.now(),
        clienteId: state.forms.agClienteId,
        tituloServico: titulo,
        categoria: "Geral",
        icone: "calendar",
        valor: valor,
        diaAgenda: state.forms.agDia,
        horaAgenda: state.forms.agHora,
        metodoPagamento: "Pix",
        status: "fazendo",
        temFotoAnexa: false,
        observacao: "",
        logs: [
          { id: "log_" + Date.now(), dataHora: "Hoje", texto: `Agendado para ${state.forms.agDia} às ${state.forms.agHora}`, tipo: "avanco" }
        ],
        parcelas: [
          { id: "p_ag_" + Date.now(), numero: 1, totalParcelas: 1, valor: valor, vencimentoTexto: state.forms.agDia, pago: false, atrasada: false }
        ]
      });
      state.forms.mostrarFormAgenda = false;
      state.forms.agTitulo = "";
      persistirEstado();
      mostrarToast("Compromisso agendado!");
      renderizarTelaPrincipal();
    }

          </button>

      const cards = pendentes.map(s => {

              <button onclick="abrirModalEditarAgenda('${s.id}')" style="border:none; background:var(--azul-fundo); color:var(--azul); width:36px; height:36px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;" title="Editar Agendamento">

              <button onclick="excluirCompromissoAgenda('${s.id}')" style="border:none; background:var(--vermelho-fundo); color:var(--vermelho); width:36px; height:36px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;" title="Excluir da Agenda">

      return `

    function copiarLinkMiniSite() {
      const url = `http://localhost:8080/site.html`;
      if (navigator.clipboard) {

      }
      mostrarToast(`Link copiado: localhost:8080/site.html`);

    function abrirFormObraPortfolio(id = null) {
      if (id) {
        const o = state.portfolioObras.find(x => x.id === id);
        if (o) {
          state.forms.portEditandoId = o.id;
          state.forms.portTitulo = o.titulo;
          state.forms.portCliente = o.bairro;
          state.forms.portPrecoBase = o.precoBase;
        }
      } else {
        state.forms.portEditandoId = null;
        state.forms.portTitulo = "";
        state.forms.portCliente = "";
        state.forms.portPrecoBase = "";
      }
      state.forms.mostrarFormPortfolio = true;
      renderizarTelaPrincipal();
    }

    function salvarObraPortfolio() {
      const titulo = state.forms.portTitulo.trim();
      if (!titulo) {
        mostrarToast("Digite o título do serviço");
        return;
      }

      if (state.forms.portEditandoId) {
        const o = state.portfolioObras.find(x => x.id === state.forms.portEditandoId);
        if (o) {
          o.titulo = titulo;
          o.bairro = state.forms.portCliente.trim() || "Cliente Verificado";
          o.precoBase = state.forms.portPrecoBase.trim() || "Sob Consulta";
        }
        mostrarToast("Obra do portfólio atualizada!");
      } else {
        state.portfolioObras.unshift({
          id: "pf_" + Date.now(),
          titulo: titulo,
          bairro: state.forms.portCliente.trim() || "Cliente Verificado",
          tempoExecucao: "Garantia inclusa",
          precoBase: state.forms.portPrecoBase.trim() || "Orçamento sem compromisso",
          icone: "check-circle-2",
          corFundo: `linear-gradient(135deg, ${state.empresa.corTema || '#2563EB'}, #0F172A)`
        });
        mostrarToast("Nova obra publicada no seu Mini Site!");
      }

      state.forms.portTitulo = "";
      state.forms.portCliente = "";
      state.forms.portPrecoBase = "";
      state.forms.portEditandoId = null;
      state.forms.mostrarFormPortfolio = false;
      persistirEstado();
      renderizarTelaPrincipal();
    }

      if (!confirm("Excluir esta obra do portfólio?")) return;
      state.portfolioObras = state.portfolioObras.filter(p => p.id !== id);

          ${state.portfolioObras.map(obra => `
            <div class="portfolio-photo-card">
              <div class="portfolio-img-cover" style="background:${obra.corFundo};">
                <i data-lucide="${obra.icone || 'wrench'}" style="width:40px; height:40px; opacity:0.9;"></i>
                <span style="position:absolute; bottom:10px; left:12px; background:rgba(0,0,0,0.45); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800;">

                  <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${cat.nomeCurto}</span>
                </label>
                
                <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                  <div style="display:flex; align-items:center; gap:2px;">
                    <span style="font-size:12px; font-weight:800; color:var(--ink-secondary);">R$</span>
                    <input type="number" value="${cat.valorSugerido}" oninput="cat.valorSugerido=parseInt(this.value||0,10); persistirEstado();" style="width:68px; padding:5px 6px; border-radius:8px; border:1.5px solid #CBD5E1; font-weight:800; font-size:13px; text-align:right;" />

                  <button onclick="excluirItemDoCatalogo('${cat.id}')" style="border:none; background:var(--vermelho-fundo); color:var(--vermelho); width:30px; height:30px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;" title="Excluir Serviço">
                    <i data-lucide="trash-2" style="width:14px; height:14px;"></i>
                  </button>
                </div>

            `).join("")}

        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <div style="font-size:21px; font-weight:800;">Meu Mini Site</div>
            <div style="font-size:13px; font-weight:700; color:var(--ink-secondary);">Seu portfólio em localhost:8080/site.html</div>
          </div>
          <a href="http://localhost:8080/site.html" target="_blank" class="btn-physical btn-escuro" style="width:auto; padding:8px 12px; font-size:13px; text-decoration:none;">

            <span>Ver em Localhost</span>
