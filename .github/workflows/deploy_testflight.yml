name: Build & Deploy iOS TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Available Xcodes
        run: |
          ls -d /Applications/Xcode*
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd "/ios-app"
          xcodegen generate --spec project.yml
          # Se o Xcode for 15, ajusta objectVersion se necessario
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' "/ios-app/CRMMEI.xcodeproj/project.pbxproj" || true

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/be94d45f-34d6-4e0d-a243-093c7b4c0e5f.mobileprovision

      - name: Build Archive & Package IPA
        run: |
          PROJ_PATH="$GITHUB_WORKSPACE/ios-app/CRMMEI.xcodeproj"

          # Compila o Archive oficial garantindo versionamento correto
          xcodebuild clean archive             -project "$PROJ_PATH"             -scheme "CRMMEI"             -configuration "Release"             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/CRMMEI.xcarchive"             MARKETING_VERSION="3.0.0"             CURRENT_PROJECT_VERSION="1"             CODE_SIGN_STYLE="Manual"             DEVELOPMENT_TEAM="Y6V67KQ9X2"             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE="be94d45f-34d6-4e0d-a243-093c7b4c0e5f"

          # Inspeciona e garante Info.plist dentro do app gerado
          APP_PLIST="$RUNNER_TEMP/CRMMEI.xcarchive/Products/Applications/CRMMEI.app/Info.plist"
          echo "=== Info.plist gerado ==="
          plutil -p "$APP_PLIST" || cat "$APP_PLIST"

          # Garante as chaves necessarias exigidas pela Apple
          plutil -replace CFBundleShortVersionString -string "3.0.0" "$APP_PLIST"
          plutil -replace CFBundleVersion -string "1" "$APP_PLIST"
          plutil -replace UILaunchStoryboardName -string "LaunchScreen" "$APP_PLIST" 2>/dev/null || true
          plutil -replace UIRequiresFullScreen -bool true "$APP_PLIST"

          # Reassina o .app apos atualizar o Info.plist
          codesign --force --sign "Apple Distribution" --timestamp --preserve-metadata=identifier,entitlements "$RUNNER_TEMP/CRMMEI.xcarchive/Products/Applications/CRMMEI.app"

          # Empacota o Payload diretamente em IPA
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -r "$RUNNER_TEMP/CRMMEI.xcarchive/Products/Applications/CRMMEI.app" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -q -r CRMMEI.ipa Payload
          ls -lh CRMMEI.ipa

      - name: Upload to TestFlight (App Store Connect API)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool --upload-app             -f "$RUNNER_TEMP/export/CRMMEI.ipa"             -t ios             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
