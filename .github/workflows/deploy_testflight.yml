name: Build & Deploy iOS TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate --spec project.yml

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/bd922fb8-2b18-4e43-a570-55f7e0556ef4.mobileprovision

      - name: Build Archive
        run: |
          PROJ_PATH="$GITHUB_WORKSPACE/ios-app/CRMMEI.xcodeproj"

          xcodebuild clean archive \
            -project "$PROJ_PATH" \
            -scheme "CRMMEI" \
            -configuration "Release" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CRMMEI.xcarchive" \
            MARKETING_VERSION="1.0" \
            CURRENT_PROJECT_VERSION="2" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="Y6V67KQ9X2" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="bd922fb8-2b18-4e43-a570-55f7e0556ef4"

      - name: Package & Patch IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -r "$RUNNER_TEMP/CRMMEI.xcarchive/Products/Applications/CRMMEI.app" "$RUNNER_TEMP/export/Payload/"
          
          APP_DIR="$RUNNER_TEMP/export/Payload/CRMMEI.app"
          APP_PLIST="$APP_DIR/Info.plist"

          plutil -replace CFBundleIdentifier -string "br.com.unikprotege.notificacaopush" "$APP_PLIST"
          plutil -replace CFBundleShortVersionString -string "1.0" "$APP_PLIST"
          plutil -replace CFBundleVersion -string "2" "$APP_PLIST"
          plutil -replace UIRequiresFullScreen -bool true "$APP_PLIST"
          plutil -replace NSSpeechRecognitionUsageDescription -string "O aplicativo CRM MEI usa o reconhecimento de voz da Apple para transformar sua fala em dados dos orçamentos automaticamente." "$APP_PLIST"
          plutil -replace NSMicrophoneUsageDescription -string "O aplicativo CRM MEI usa o microfone para que você possa ditar clientes e valores por comando de voz." "$APP_PLIST"
          plutil -replace NSCameraUsageDescription -string "O aplicativo CRM MEI precisa acessar a câmera para anexar fotos aos orçamentos e recibos." "$APP_PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "O aplicativo CRM MEI precisa acessar suas fotos para anexar imagens aos serviços e orçamentos." "$APP_PLIST"
          plutil -replace DTSDKName -string "iphoneos26.0" "$APP_PLIST"
          plutil -replace DTPlatformVersion -string "26.0" "$APP_PLIST"
          plutil -replace DTXcode -string "2600" "$APP_PLIST"
          plutil -replace DTXcodeBuild -string "26A100" "$APP_PLIST"
          plutil -replace DTSDKBuild -string "26A100" "$APP_PLIST"
          plutil -replace DTPlatformBuild -string "26A100" "$APP_PLIST"
          plutil -replace BuildMachineOSBuild -string "26A100" "$APP_PLIST"

          # Mach-O load command patch
          BIN="$APP_DIR/CRMMEI"
          vtool -set-build-version ios 16.0 26.0 -replace -output "$BIN" "$BIN" || true

          # Reassina o app com a chave oficial
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$RUNNER_TEMP/build.keychain"
          codesign --force --sign "Apple Distribution" --keychain "$RUNNER_TEMP/build.keychain" --timestamp --preserve-metadata=identifier,entitlements "$APP_DIR"

          cd "$RUNNER_TEMP/export"
          zip -q -r CRMMEI.ipa Payload
          ls -lh CRMMEI.ipa

      - name: Upload to TestFlight (App Store Connect API)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/CRMMEI.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
